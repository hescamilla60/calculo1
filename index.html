<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEJV · Funciones para Cálculo Diferencial</title>
<style>
 :root{--bg:#f7f8fa;--card:#fff;--tx:#1d2330;--mu:#5b6578;--ac:#2557d6;--ok:#14804a;--er:#b4441c;--bd:#dde1e8}
 @media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mu:#98a2b5;--ac:#7da2ff;--ok:#54d08f;--er:#ff9a6e;--bd:#323946}}
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
 main{max-width:760px;margin:auto;padding:16px}
 nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
 nav button{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
 nav button.on{border-color:var(--ac);color:var(--ac);font-weight:600} nav button.done::after{content:" ✓";color:var(--ok)}
 .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
 .step{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
 label{display:block;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
 label:has(input:checked){border-color:var(--ac)}
 .btn{padding:9px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
 .btn:disabled{opacity:.4;cursor:default}
 canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
 .fb{padding:12px;border-radius:8px;margin-top:10px} .fb.ok{border-left:4px solid var(--ok)} .fb.er{border-left:4px solid var(--er)}
 .hide{display:none}
</style>
</head>
<body>
<main>
 <h2>Funciones: predice, elige, justifica, verifica</h2>
 <nav id="nav"></nav>
 <div class="card"><div class="step" id="tit"></div><p id="enun"></p></div>
 <!-- Estado 1-2: Predicción y Justificación -->
 <div class="card" id="pj">
  <div class="step">1 · Predice y elige</div><p id="pred"></p><div id="opts"></div>
  <div class="step" style="margin-top:14px">2 · Justifica</div><div id="juss"></div>
  <button class="btn" id="go" disabled>Verificar</button>
 </div>
 <!-- Estado 3-4: Verificación y feedback -->
 <div class="card hide" id="vf">
  <div class="step">3 · Verifica</div>
  <canvas id="cv" width="700" height="380"></canvas>
  <div id="sl" style="margin-top:8px"></div>
  <div class="fb" id="fb"></div>
  <p><button class="btn" id="next"></button></p>
 </div>
</main>
<script>
/* ===================== MOTOR ===================== */
// Evalúa expresiones del banco (contenido de confianza, escrito por el autor) con parámetros p.
const fx=(e,p,x=0)=>Function("x","p","with(Math){with(p){return "+e+"}}")(x,p);
// Sustituye {expresión} dentro de textos; ej. "{2*k}" -> 6
const sub=(s,p)=>s.replace(/\{([^}]+)\}/g,(_,e)=>{const v=fx(e,p);return typeof v==="number"?+v.toFixed(3):v});
const $=id=>document.getElementById(id);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

let bank=[],cur=0,p={},prev=null,done=new Set(),ex;

// Elige parámetros aleatorios; en reintentos evita repetir la combinación anterior.
function pickParams(P){
  let q,t=0;
  do{q={};for(const k in P)q[k]=P[k][Math.floor(Math.random()*P[k].length)];t++}
  while(prev&&JSON.stringify(q)===prev&&t<20);
  prev=JSON.stringify(q);return q;
}

// ESTADO INICIAL: carga ejercicio con nuevos parámetros
function load(i){
  cur=i;ex=bank[i];p=pickParams(ex.P);
  $("tit").textContent=`Módulo ${ex.m} · ${ex.id} · ${ex.t}`;
  $("enun").textContent=sub(ex.e,p);
  $("pred").textContent=sub(ex.pr,p);
  draw($("opts"),"o",ex.o.map(o=>[sub(o[0],p),o[1]]));
  draw($("juss"),"j",ex.j.map(j=>[sub(j[0],p),j[1],sub(j[2]||"",p)]));
  $("pj").classList.remove("hide");$("vf").classList.add("hide");$("go").disabled=true;
  document.querySelectorAll("#nav button").forEach((b,k)=>b.classList.toggle("on",k===i));
}
// Opciones barajadas con radio buttons
function draw(box,name,items){
  box.innerHTML="";
  shuffle(items.map((x,i)=>({x,i}))).forEach(({x,i})=>{
    const l=document.createElement("label");
    l.innerHTML=`<input type="radio" name="${name}" value="${i}"> `;
    l.append(x[0]);l.querySelector("input").onchange=()=>{
      $("go").disabled=!(document.querySelector('[name=o]:checked')&&document.querySelector('[name=j]:checked'))};
    box.append(l)});
}

// VERIFICACIÓN + FEEDBACK
$("go").onclick=()=>{
  const io=+document.querySelector("[name=o]:checked").value, ij=+document.querySelector("[name=j]:checked").value;
  const okP=ex.o[io][1]===1, okJ=ex.j[ij][1]===1, ok=okP&&okJ;
  $("pj").classList.add("hide");$("vf").classList.remove("hide");
  // Slider: explora la gráfica variando el primer parámetro (control de comprensión)
  const key=Object.keys(ex.P)[0],vals=ex.P[key],lo=Math.min(...vals),hi=Math.max(...vals);
  $("sl").innerHTML=`${key} = <input type="range" id="rg" min="${lo}" max="${hi}" step="1" value="${p[key]}"> <b id="rv">${p[key]}</b>`;
  $("rg").oninput=e=>{p[key]=+e.target.value;$("rv").textContent=p[key];plot()};
  plot();
  const fb=$("fb");fb.className="fb "+(ok?"ok":"er");
  if(ok){ // Acierto: refuerzo + avance
    done.add(cur);fb.textContent="¡Muy bien! Tu predicción y tu argumento son coherentes con la gráfica. Mueve el deslizador para ver que la regla se mantiene para otros valores del parámetro.";
    $("next").textContent="Siguiente ejercicio →";$("next").onclick=()=>load((cur+1)%bank.length);
  }else{ // Error: andamio sin revelar respuesta + variante análoga
    fb.textContent=(!okP?"Revisa tu predicción: "+ex.h:"")+(!okP&&!okJ?" ":"")+(!okJ?"Revisa tu justificación: "+sub(ex.j[ij][2],p):"")+" Observa la gráfica e intenta una variante.";
    $("next").textContent="Reintentar con una variante ↻";$("next").onclick=()=>load(cur);
  }
  buildNav();
};

/* ===================== GRÁFICO (canvas) ===================== */
function plot(){
  const c=$("cv"),g=c.getContext("2d"),[x0,x1,y0,y1]=ex.v,W=c.width,H=c.height;
  const X=x=>(x-x0)/(x1-x0)*W,Y=y=>H-(y-y0)/(y1-y0)*H;
  const css=getComputedStyle(document.body);const col=n=>css.getPropertyValue(n).trim()||"#888";
  g.clearRect(0,0,W,H);g.lineWidth=1;g.strokeStyle=col("--bd");g.fillStyle=col("--mu");g.font="12px sans-serif";
  for(let x=Math.ceil(x0);x<=x1;x+=Math.max(1,Math.round((x1-x0)/14))){g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),H);g.stroke();g.fillText(x,X(x)+2,Math.min(H-2,Y(0)+12))}
  const sy=(y1-y0)/8;for(let y=Math.ceil(y0/sy)*sy;y<=y1;y+=sy){g.beginPath();g.moveTo(0,Y(y));g.lineTo(W,Y(y));g.stroke();g.fillText(+y.toFixed(2),2,Y(y)-2)}
  g.strokeStyle=col("--tx");g.lineWidth=1.5;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  if(ex.g){g.strokeStyle="#e07b00";g.setLineDash([6,4]);curve(ex.g);g.setLineDash([])}  // curva naranja: transformada/inversa
  g.strokeStyle=col("--ac");curve(ex.f);                                                  // curva azul: f
  if(ex.g){const a=Math.abs(x1-x0)>0?Math.min(x1,y1):0;g.strokeStyle=col("--mu");g.setLineDash([2,4]);g.beginPath();g.moveTo(X(Math.max(x0,y0)),Y(Math.max(x0,y0)));g.lineTo(X(a),Y(a));g.stroke();g.setLineDash([])}
  if(ex.hole){const [hx,hy]=fx(ex.hole,p);g.fillStyle=col("--card");g.strokeStyle=col("--ac");g.beginPath();g.arc(X(hx),Y(hy),5,0,7);g.fill();g.stroke()}
  function curve(e){ // muestreo; corta el trazo en discontinuidades / indefinidos
    g.lineWidth=2.2;g.beginPath();let on=false,py=0;
    for(let i=0;i<=W;i++){const x=x0+i/W*(x1-x0),y=fx(e,p,x);
      if(!isFinite(y)||Math.abs(y-py)>(y1-y0)*0.8&&on){on=false;if(!isFinite(y)){py=0;continue}}
      on?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));on=true;py=y}
    g.stroke()}
}

/* ===================== ARRANQUE ===================== */
function buildNav(){const n=$("nav");n.innerHTML="";bank.forEach((b,i)=>{const e=document.createElement("button");
  e.textContent=b.id;e.className=(i===cur?"on ":"")+(done.has(i)?"done":"");e.onclick=()=>load(i);n.append(e)})}
fetch("data/banco.json").then(r=>r.json()).then(b=>{bank=b;buildNav();load(0)})
 .catch(()=>$("enun").textContent="No se pudo cargar data/banco.json (usa un servidor: python -m http.server).");
</script>
</body>
</html>
